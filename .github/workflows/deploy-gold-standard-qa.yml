name: Gold Standard QA (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    environment: gold-standard-qa
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack exact QA archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="staging/Gold-Standard-QA-Staging-Verified.zip"
          test -f "$ARCHIVE" || { echo "::error::QA archive missing; upload it to staging/ on the staging branch"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
          unzip -t "$ARCHIVE" >/dev/null
          mkdir -p qa-release
          unzip -q "$ARCHIVE" -d qa-release
          test -s qa-release/staging/index.html
          test -s qa-release/staging/config.js
          test -s qa-release/staging/backend.js
          grep -q 'zhhgbwxjyhypxzqqbcqu' qa-release/staging/config.js || { echo "::error::QA database configuration missing"; exit 1; }
          if grep -R -E -l 'sk_live_|service_role' qa-release/staging; then
            echo "::error::Potential privileged secret detected"; exit 1
          fi
      - name: Publish isolated QA worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --assets ./qa-release/staging --name gold-standard-qa

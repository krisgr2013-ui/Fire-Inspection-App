name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  html-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML structure
        run: npx --yes html-validate gold-standard-v2.html --formatter stylish

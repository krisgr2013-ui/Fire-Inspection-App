name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  html-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate HTML structure and JavaScript syntax
        run: python .github/scripts/validate_app.py

name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build

<div id="splash" aria-hidden="true">
  <div class="sp-glow"></div>
  <div class="sp-in">
    <div class="sp-mark" id="sp-mark">
      <img class="sp-logo" src="icons/gold-standard-approved-emblem.png?v=17" width="132" height="132" alt="Gold Standard fire extinguisher emblem">
    </div>
    <div class="sp-word" id="sp-word"><span class="sp-gold">GOLD</span> STANDARD</div>
    <div class="sp-sub" id="sp-sub">SERVICE HUB</div>
    <div class="sp-bar"><i></i></div>
    <div class="sp-tag" id="sp-tag">Built for service techs by service techs</div>
  </div>
</div>
<script>
window.SPLASH_T0 = performance.now();
(function () {
  try {
    var t = localStorage.getItem('gs-theme'); if (t === 'dark') document.getElementById('splash').classList.add('sp-dark');
    var b = JSON.parse(localStorage.getItem('gs-brand') || 'null');
    if (b && b.logo && /^(data:image\/|https:\/\/)/.test(b.logo) && location.search.indexOf('portal=') < 0) {
      var m = document.getElementById('sp-mark'); m.innerHTML = ''; var img = new Image(); img.src = b.logo; img.alt = ''; img.className = 'sp-logo'; m.appendChild(img);
      document.getElementById('sp-word').textContent = b.name || ''; document.getElementById('sp-word').classList.add('sp-name');
      document.getElementById('sp-sub').textContent = 'POWERED BY GOLD STANDARD SERVICE HUB';
      document.getElementById('sp-sub').classList.add('sp-pow');
    }
    if (b && /^#[0-9a-f]{6}$/i.test(b.color || '')) document.getElementById('splash').style.setProperty('--sp-c', b.color);
  } catch (e) {}
  setTimeout(function () { var s = document.getElementById('splash'); if (s) { s.classList.add('sp-out'); setTimeout(function () { s.remove(); }, 520); } }, 8500);
})();
</script>
